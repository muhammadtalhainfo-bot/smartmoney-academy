name: Dependency Audit Diagnostic

on:
  push:
    branches: [maintenance/next-16-3-8]

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - name: Apply lockfile-only audit fixes
        run: npm audit fix --package-lock-only
      - run: npm ci
      - name: Audit after fixes
        run: |
          npm audit --json > audit.json || true
          node -e "
            const a=require('./audit.json');
            const v=a.vulnerabilities||{};
            console.log('metadata', JSON.stringify(a.metadata?.vulnerabilities||{}));
            for (const [name,item] of Object.entries(v)) {
              console.log(JSON.stringify({
                name,
                severity:item.severity,
                isDirect:item.isDirect,
                via:(item.via||[]).map(x=>typeof x==='string'?x:x.title||x.name||x.source||'advisory'),
                range:item.range,
                fix:item.fixAvailable
              }));
            }
          "
      - run: npm run build
      - name: Commit dependency remediation
        run: |
          if git diff --quiet -- package-lock.json package.json; then
            echo "No dependency changes generated."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: remediate npm audit dependencies [skip ci]"
          git pull --rebase origin maintenance/next-16-3-8
          git push origin HEAD:maintenance/next-16-3-8
