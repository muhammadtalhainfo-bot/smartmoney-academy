name: Build Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: Guard against retired site claims
        run: |
          if git grep -nEi --             -e '28\+? modules'             -e '80\+? lessons'             -e '192\+? lessons'             -e 'join (the )?discord'             -e 'discord\.gg'; then
            echo "Found a retired ICT Flow claim or Discord reference."
            exit 1
          fi
      - run: npm run build
