name: Build Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: build-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: 1
      NEXT_PUBLIC_APP_URL: https://ictflow.com
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-key
      NEXT_PUBLIC_STRIPE_MONTHLY_PRICE: price_ci_monthly
      NEXT_PUBLIC_STRIPE_YEARLY_PRICE: price_ci_yearly

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Guard against retired site claims
        run: |
          if git grep -nEi --
            -e '28+? modules'
            -e '80+? lessons'
            -e '192+? lessons'
            -e 'join (the )?discord'
            -e 'discord.gg'; then
            echo "Found a retired ICT Flow claim or Discord reference."
            exit 1
          fi

      - name: Build production bundle
        run: npm run build
