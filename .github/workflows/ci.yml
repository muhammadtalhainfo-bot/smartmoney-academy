name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint changed code and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: 1
      NEXT_PUBLIC_APP_URL: https://ictflow.com
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-public-anon-key
      NEXT_PUBLIC_STRIPE_MONTHLY_PRICE: price_ci_monthly
      NEXT_PUBLIC_STRIPE_YEARLY_PRICE: price_ci_yearly

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Guard against retired site claims
        run: |
          if git grep -nEi \
            -e '\b28\+?[[:space:]]+modules\b' \
            -e '\b80\+?[[:space:]]+lessons\b' \
            -e '\b192\+?[[:space:]]+lessons\b' \
            -e 'join (the )?discord' \
            -e 'discord\\.gg' \\
            -e '\\b10[[:space:]]+sections\\b' \\
            -e '\\$19/(month|MONTH)' \\
            -e '\\$149/(year|YEAR)' -- app lib public; then
            echo "Found a retired ICT Flow claim or Discord reference."
            exit 1
          fi

      - name: Lint changed JavaScript/JSX
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
          else
            base_sha="${{ github.event.before }}"
          fi

          if [[ -z "$base_sha" || "$base_sha" == "0000000000000000000000000000000000000000" ]]; then
            echo "No usable base SHA; skipping changed-file lint."
            exit 0
          fi

          files="$(git diff --name-only "$base_sha" "$GITHUB_SHA" -- '*.js' '*.jsx' '*.mjs' '*.cjs')"
          if [[ -z "$files" ]]; then
            echo "No JavaScript/JSX source files changed."
            exit 0
          fi

          printf 'Linting changed files:\n%s\n' "$files"
          # shellcheck disable=SC2086
          npx eslint $files

      - name: Full lint audit (non-blocking)
        shell: bash
        run: |
          set +e
          npm run lint
          status=$?
          if [[ $status -ne 0 ]]; then
            echo "::warning::Full-project lint still reports legacy issues; changed-file lint above remains the blocking lint gate."
          fi
          exit 0

      - name: Build production bundle
        run: npm run build
