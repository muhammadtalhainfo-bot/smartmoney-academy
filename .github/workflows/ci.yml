name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint changed code and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: 1
      NEXT_PUBLIC_APP_URL: https://ictflow.com
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-public-anon-key
      NEXT_PUBLIC_STRIPE_MONTHLY_PRICE: price_ci_monthly
      NEXT_PUBLIC_STRIPE_YEARLY_PRICE: price_ci_yearly

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies for high-severity vulnerabilities
        run: npm audit --omit=dev --audit-level=high

      - name: Generate and validate Open Graph PNG
        run: node scripts/generate-og-image.cjs

      - name: Guard against retired site claims
        run: node scripts/check-retired-site-claims.cjs

      - name: Validate public curriculum count copy
        run: node scripts/check-curriculum-count-copy.cjs

      - name: Validate robots.txt and noindex alignment
        run: node scripts/check-robots-indexing.cjs

      - name: Validate sitemap integrity
        run: node scripts/check-sitemap-integrity.cjs

      - name: Validate certificate completion model
        run: node scripts/check-certificate-completion.cjs

      - name: Validate SEO guide content and related links
        run: node scripts/check-seo-guides.cjs

      - name: Validate public ICT lesson editorial claims
        run: node scripts/check-lesson-editorial-claims.cjs

      - name: Validate lesson accordion rendering for SEO and accessibility
        run: node scripts/check-lesson-accordion-rendering.cjs


      - name: Validate blog editorial claims and context
        run: node scripts/check-blog-editorial-claims.cjs

      - name: Validate database-backed blog editorial safety
        run: node scripts/check-blog-database-editorial-guard.cjs

      - name: Validate topic-aware blog related reading
        run: node scripts/check-blog-related-posts.cjs

      - name: Validate blog article schema and breadcrumbs
        run: node scripts/check-blog-article-schema.cjs

      - name: Validate optimized local fonts
        run: node scripts/check-font-optimization.cjs

      - name: Validate AdSense publisher and ads.txt consistency
        run: node scripts/check-adsense-config.cjs

      - name: Validate release documentation includes credential-rotation and deployment-status gates
        run: node scripts/check-release-security-docs.cjs

      - name: Validate billing recovery and admin deletion safety
        run: node scripts/check-billing-recovery.cjs

      - name: Validate Supabase SECURITY DEFINER search paths
        run: node scripts/check-supabase-security-definers.cjs

      - name: Test streak date monotonicity
        run: node scripts/test-streak-date-monotonicity.mjs

      - name: Test paginated Stripe subscription lookup
        run: node scripts/test-stripe-subscription-pagination.mjs

      - name: Lint changed JavaScript/JSX
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
          else
            base_sha="${{ github.event.before }}"
          fi

          if [[ -z "$base_sha" || "$base_sha" == "0000000000000000000000000000000000000000" ]]; then
            echo "No usable base SHA; skipping changed-file lint."
            exit 0
          fi

          files="$(git diff --name-only "$base_sha" "$GITHUB_SHA" -- '*.js' '*.jsx' '*.mjs' '*.cjs')"
          if [[ -z "$files" ]]; then
            echo "No JavaScript/JSX source files changed."
            exit 0
          fi

          printf 'Linting changed files:\n%s\n' "$files"
          # shellcheck disable=SC2086
          npx eslint $files

      - name: Full lint audit (non-blocking)
        shell: bash
        run: |
          set +e
          npm run lint
          status=$?
          if [[ $status -ne 0 ]]; then
            echo "::warning::Full-project lint still reports legacy issues; changed-file lint above remains the blocking lint gate."
          fi
          exit 0

      - name: Build production bundle
        run: npm run build