name: Prepare Next Security Upgrade

on:
  push:
    branches: [maintenance/next-16-3-8]

permissions:
  contents: write

# Generated lockfile is committed only after the patched dependency builds.

jobs:
  upgrade:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm install next@16.3.8 --save-exact --package-lock-only
      - run: npm ci
      - run: npm run build
      - name: Commit generated lockfile
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "No dependency changes generated."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: upgrade Next.js to 16.3.8 [skip ci]"
          git push origin HEAD:maintenance/next-16-3-8
