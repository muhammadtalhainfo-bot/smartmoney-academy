name: Dependency Sync Verification

on:
  push:
    branches: [maintenance/quality-audit-2026-10-01]

permissions:
  contents: write

jobs:
  verify-and-sync:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-key
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Align Next.js ESLint config
        run: npm install eslint-config-next@16.3.8 --save-exact --package-lock-only

      - name: Clean install
        run: npm ci

      - name: Security audit
        run: npm audit --audit-level=high

      - name: Production build
        run: npm run build

      - name: Commit generated lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: sync eslint-config-next lockfile"
          git push
