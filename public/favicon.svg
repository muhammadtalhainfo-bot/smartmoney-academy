<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F0C96A"/>
      <stop offset="100%" style="stop-color:#8A6B28"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="100" height="100" rx="18" fill="#080808"/>
  
  <!-- Candlestick chart bars -->
  <rect x="18" y="55" width="8" height="25" rx="2" fill="url(#gold)" opacity="0.4"/>
  <rect x="30" y="40" width="8" height="40" rx="2" fill="url(#gold)" opacity="0.6"/>
  <rect x="42" y="28" width="8" height="52" rx="2" fill="url(#gold)" opacity="0.8"/>
  
  <!-- Flow line over bars -->
  <polyline points="22,52 34,38 46,24 74,18" fill="none" stroke="url(#gold)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- IF text -->
  <text x="58" y="72" font-family="Arial Black, sans-serif" font-size="28" font-weight="900" fill="url(#gold)" letter-spacing="-1">IF</text>
  
  <!-- Dot accent -->
  <circle cx="74" cy="18" r="3.5" fill="#F0C96A"/>
</svg>